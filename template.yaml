  SessionAuthorizerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/functions/authorizer.ts
    Properties:
      Description: Lambda authorizer that checks the session token (used by the LaTeX compiler route).
      Runtime: nodejs22.x
      Architectures: [!Ref Architecture]
      CodeUri: ./
      Handler: authorizer.handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt Table.Arn

  SessionAuthorizerFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SessionAuthorizerFunction}
      RetentionInDays: !Ref LogRetentionDays

  # SAM doesn't grant API Gateway invoke rights for an authorizer given by
  # FunctionArn; without this every authorized route returns 500.
  SessionAuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SessionAuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/authorizers/*

  # LaTeX compiler: container image with Tectonic and a pre-warmed package cache.
  # LaTeX can read files on the machine it runs on, so this function gets no
  # secrets (the Globals values are blanked) and no permissions beyond logging.
  LatexFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: latex/Dockerfile
      DockerContext: .
      DockerTag: tectonic-0.17.0
    Properties:
      Description: Compiles LaTeX resumes to PDF in isolation (no data access, no secrets).
      PackageType: Image
      Architectures: [x86_64]
      MemorySize: 2048
      Timeout: 60
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          AUTH_SECRET: ""
          DATA_ENCRYPTION_KEY: ""
          GOOGLE_CLIENT_SECRET: ""
          S3_SECRET_ACCESS_KEY: ""
          TECTONIC_SEED_CACHE: /opt/tectonic-cache
      Events:
        CompileLatex:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /latex/compile
            Auth:
              Authorizer: SessionAuthorizer

  LatexFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${LatexFunction}
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  ApiUrl:
    Description: Base URL for the frontend's NEXT_PUBLIC_API_URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Description: DynamoDB table
    Value: !Ref Table
  DocumentsBucketName:
    Description: Private S3 bucket for uploaded files
    Value: !Ref DocumentsBucket
  PortfolioImagesUrl:
    Description: Public base URL for portfolio images
    Value: !Ref PortfolioAssetsUrl
