AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  IamCandidate backend (iamcandidate-server): API Gateway HTTP API + Lambda (Node.js/TypeScript)
  + DynamoDB (single table) + private S3 bucket for documents. No AI services.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [local, dev, staging, prod]
    Description: Deployment stage; used in resource names.
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:3000
    Description: >-
      Frontend origins allowed by CORS (API and S3 uploads), comma-separated.
      Set this to the deployed frontend domain, e.g. https://iamcandidate.example.com.
  AuthSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >-
      Secret used to sign session tokens (32+ random characters). Generate one with
      `node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"`.
      Changing it signs everyone out.
  EncryptionKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >-
      Key for encrypting stored secrets such as users' SMTP passwords (32+ random
      characters, generated like AuthSecret). Changing it makes saved SMTP passwords
      unreadable — users would need to re-enter them.
  GoogleClientId:
    Type: String
    Default: ""
    Description: Google OAuth client ID for the Drive integration (leave empty to disable it).
  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Google OAuth client secret.
  GoogleRedirectUri:
    Type: String
    Default: ""
    Description: >-
      Where Google returns after consent, e.g.
      https://your-frontend.example.com/integrations/google-drive/callback. Must match the
      OAuth client's authorized redirect URI exactly.
  DefaultUserId:
    Type: String
    Default: usr_demo
    Description: Fallback data owner, only used if AUTH_SECRET is missing (tests).
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: >-
      Lambda CPU architecture. arm64 (Graviton) is cheaper in AWS; `npm run start` passes
      x86_64 so `sam local` doesn't emulate ARM on Intel/AMD machines.
  PortfolioBucketName:
    Type: String
    Default: ganesh-portfolio-images-321323327217
    Description: >-
      Existing public-read S3 bucket for portfolio images (managed outside this stack).
      Its policy must allow public s3:GetObject on portfolio/* and its CORS must allow
      PUT from the frontend origins.
  PortfolioAssetsUrl:
    Type: String
    Default: https://ganesh-portfolio-images-321323327217.s3.ap-south-1.amazonaws.com
    Description: Public base URL the portfolio images are served from (S3 or a CDN in front of it).
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]

Globals:
  # Runtime, Architectures and CodeUri are set per function: the LaTeX
  # compiler is a container image, which can't inherit them.
  Function:
    MemorySize: 512
    Timeout: 10
    Environment:
      Variables:
        STAGE: !Ref Stage
        DYNAMODB_TABLE: !Ref Table
        S3_BUCKET: !Ref DocumentsBucket
        PORTFOLIO_BUCKET: !Ref PortfolioBucketName
        PORTFOLIO_ASSETS_URL: !Ref PortfolioAssetsUrl
        ALLOWED_ORIGINS: !Join [",", !Ref AllowedOrigins]
        DEFAULT_USER_ID: !Ref DefaultUserId
        AUTH_SECRET: !Ref AuthSecret
        DATA_ENCRYPTION_KEY: !Ref EncryptionKey
        GOOGLE_CLIENT_ID: !Ref GoogleClientId
        GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
        GOOGLE_REDIRECT_URI: !Ref GoogleRedirectUri
        NODE_OPTIONS: --enable-source-maps
        # Local-only overrides (set in env.local.json). Empty in AWS, so the SDK
        # uses the regional endpoints and the function's IAM role.
        DYNAMODB_ENDPOINT: ""
        S3_ENDPOINT: ""
        S3_PUBLIC_ENDPOINT: ""
        S3_ACCESS_KEY_ID: ""
        S3_SECRET_ACCESS_KEY: ""
        ALLOW_PRIVATE_SMTP_HOSTS: ""

Resources:
  # ------------------------------------------------------------------
  # API
  # ------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: IamCandidate REST API
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [content-type, authorization]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod",
          "path":"$context.path","routeKey":"$context.routeKey","status":"$context.status",
          "latencyMs":"$context.responseLatency","integrationError":"$context.integrationErrorMessage"}
      # Authentication is built in: every route except POST /auth/login checks
      # the bearer token in the Lambda (src/lib/auth.ts). The LaTeX compiler holds
      # no secrets, so its route is checked here by SessionAuthorizer instead.
      Auth:
        Authorizers:
          SessionAuthorizer:
            FunctionArn: !GetAtt SessionAuthorizerFunction.Arn
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            Identity:
              Headers: [Authorization]
              # No caching: disabled or deleted users are rejected immediately.
              ReauthorizeEvery: 0

  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/personal-os-${Stage}
      RetentionInDays: !Ref LogRetentionDays

  # ------------------------------------------------------------------
  # Data
  # ------------------------------------------------------------------
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub personal-os-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub personal-os-documents-${AWS::AccountId}-${Stage}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          # Browsers PUT files to presigned URLs and GET downloads directly.
          - AllowedOrigins: !Ref AllowedOrigins
            AllowedMethods: [PUT, GET]
            AllowedHeaders: [content-type]
            ExposedHeaders: [ETag]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DocumentsBucket.Arn
              - !Sub ${DocumentsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  # ------------------------------------------------------------------
  # Functions, grouped by domain. Every route is an explicit HTTP API route;
  # DynamoDB/S3 permissions are scoped to what each function actually calls.
  # ------------------------------------------------------------------

